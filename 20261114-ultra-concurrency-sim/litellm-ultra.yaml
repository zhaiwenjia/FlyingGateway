# LiteLLM 超高并发等价模拟配置：ultra-model 经 8 个 openai-compatible 部署指向「同一假上游」
# （127.0.0.1:9102-9109），与 FlyingGateway 同源。weight 相同 ⇒ 路由层负载均衡到 8 个上游端口，
# 网关→上游端口空间各 16384 ⇒ 上游侧不人为设限（公平对比，瓶颈留给进程本身）。
model_list:
  - model_name: ultra-model
    litellm_params:
      model: openai/deepseek-chat
      api_base: http://127.0.0.1:9102/v1
      api_key: sk-ultra-fake
      weight: 1
    model_info: { id: ultra-1 }
