# LiteLLM 代理基线配置（被测对照组；key 走环境变量，⛔ 不落明文）
model_list:
  - model_name: mimo-v2.6-flash
    litellm_params:
      model: openai/mimo-v2.6-flash
      api_base: https://api.xiaomimimo.com/v1
      api_key: os.environ/MIMO_API_KEY
litellm_settings:
  drop_params: true
general_settings:
  master_key: sk-litellm-local-master
