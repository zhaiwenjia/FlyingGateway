[project]
name = "flying-gateway"
version = "0.1.0"
description = "智能体 LLM 网关：多模型端点注册、请求路由与分发、失败重试与降级"
requires-python = ">=3.12,<3.13"

# 运行时依赖：**目前 0 个** —— 网关核心只依赖标准库。
#
# 【为什么现在不引第三方库】（AGENTS.md 规则 6「除非必要，不引入新依赖」）
#   端点注册、路由决策、降级链构建，全是**纯数据结构与纯逻辑**，
#   标准库足够；而 HTTP 客户端、限流器这类东西要等真正要发请求时再引。
#   ⇒ 依赖越少越好装，也更好看清机制本身。
dependencies = []

[dependency-groups]
dev = [
    # CI 的静态检查与格式门禁（AGENTS.md 规则 20）。
    # 只有 ruff：门禁命令逐字是 `ruff check src/ test/ main.py` 与
    # `ruff format --check src/ test/ main.py`。
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# 打包配置：src/ 就是导入根
# ---------------------------------------------------------------------------
# `sources = ["src"]` 告诉 hatchling 把 src/ 剥掉 ⇒ 装完之后
# `import flying_gateway` 直接可用，根目录的 main.py 不必再往 sys.path 里塞东西。
#
# 【与 next_gen_agent_system 的差异（有意）】
#   源仓刻意让顶层包名是 `core` / `tools` 这类通用词，好处是目录一眼看清分层，
#   坏处是容易和别的包撞名。本仓用 `flying_gateway` 这种带项目名的顶层包，
#   代价是多打几个字，换来的是安装到别的项目里不会撞名。
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff.lint]
# 与仓库根一致的检查项：open() 缺 encoding=
# （AGENTS.md 规则 20：门禁命令与 ci.yml 逐字一致，配置也只开这一项）
select = ["PLW1514"]

[tool.ruff]
# preview = true：ruff 的预览规则默认关闭，这里显式打开。
# line-length 未设 ⇒ 用 ruff 默认的 88。
preview = true

# ---------------------------------------------------------------------------
# 仓库级 uv 镜像源钉死
# ---------------------------------------------------------------------------
# 【为什么钉死】uv.lock 里的下载 URL 会被**本机 uv 的全局配置**静默改写
# （实测过 TUNA ↔ CERNET/USTC-chinanet 漂移：版本与 hash 不变、只有 URL 变）
# ⇒ 在仓库级钉死 default-index ⇒ 任何环境里跑 uv 产生的改写都收敛到同一处
# ⇒ 与入库版本一致 ⇒ 漂移归零。
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true
