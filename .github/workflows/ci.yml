# .github/workflows/ci.yml
# GitHub Actions CI 流水线（Go）
#
# 任务:
#   1. lint      - gofmt 格式检查 + go vet 静态检查 + go build 编译
#   2. unit-test - go test -race（竞态检测）
#
# 约定:
#   - go.mod 在仓库根，module = github.com/zhaiwenjia/FlyingGateway；
#   - 测试文件 `<被测文件名>_test.go` 与被测文件同包（go test 只认 _test.go 后缀）；
#   - 版本 = git tag（v主.大.小）+ ldflags 注入 internal/version.Version，
#     ⛔ 不在源码硬编码版本号，CI 不做逐文件版本校验（见 AGENTS.md 版本管理条）。
#
# 【触发配置】
#   - **仅 pull_request 到 main**；
#   - **没有 `push` 触发器** ⇒ 推分支不会起 run、不烧 Actions 分钟；
#     理由：PR 合并走 squash 会产生新 SHA，GitHub 当成一次全新提交，
#     于是同一份代码在 PR 里验过一遍、squash 后又跑一遍，纯浪费。
#   - 加了 `paths:` 过滤 ⇒ 只有碰代码/依赖/CI 自身的提交才跑；
#     文档提交（README.md / AGENTS.md / progress/ / docs/）不过下面任何一道门禁，
#     不该烧分钟。
#
# ⚠️ **推之前先本地跑一遍本文件里的四道门禁**（AGENTS.md 的 CI 条）：
#    `gofmt -l .` · `go vet ./...` · `go build ./...` · `go test -race ./...`
#    —— 别用「推上去看 CI 报什么」来验证，那是拿 Actions 分钟换本地就能查出的信息。
name: CI

on:
  pull_request:
    branches: [main]
    # 只在这些路径变了才跑。文档(README.md AGENTS.md progress/ docs/)
    # 不在其中 —— 它们既不过 gofmt 也不参与构建。
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  # 手动触发保留：老宅要能随时手动验一次（不触发就不烧 Actions 分钟）。
  workflow_dispatch:

# 取消上一次尚未完成的同 PR run，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # 1) Lint — gofmt + go vet + go build
  # -----------------------------------------------------------------
  lint:
    name: Lint (gofmt + vet + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go 版本以 go.mod 的 go 指令为准 ⇒ CI 与本地同一 toolchain 行为，
      # 避免「本地绿、CI 红」因 Go 版本漂移。
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # gofmt：有任何输出 = 有文件不合格式 ⇒ 失败
      - name: gofmt check
        run: |
          OUT=$(gofmt -l .)
          if [ -n "$OUT" ]; then
            echo "::error::files not gofmt-formatted:"
            echo "$OUT"
            exit 1
          fi
          echo "gofmt: all files formatted."

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

  # -----------------------------------------------------------------
  # 2) Unit tests — go test -race
  # -----------------------------------------------------------------
  unit-test:
    name: Unit tests (go test -race)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go test
        run: go test -race ./...
